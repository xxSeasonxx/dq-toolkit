[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dqkit"
version = "0.1.0"
description = "Modular, Spark-efficient data-quality toolkit: anomaly detection and entity resolution on a typed foundation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Season Yang" }]
keywords = ["pyspark", "data-quality", "anomaly-detection", "entity-resolution"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pyspark>=3.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.4.10",  # pinned: formatter output is version-specific
]

[tool.hatch.build.targets.wheel]
packages = ["src/dqkit"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# `functions as F` is the universal PySpark idiom.
ignore = ["N812"]

[tool.pytest.ini_options]
addopts = "-q --cov=dqkit --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["dqkit"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
